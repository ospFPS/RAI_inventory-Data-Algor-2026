{% if results %}
<div class="result-list">
    {% for item in results %}
    <div class="result-item {{ 'stock-out-card' if item.status.value == 'Out of Stock' else '' }}">
        <div>
            <strong>{{ item.item_name }}</strong>
            <div class="meta">{{ item.type }} · available {{ item.available_qty }} / {{ item.live_qty }}{% if item.status.value == "Out of Stock" %} · OUT OF STOCK{% endif %}</div>
        </div>
        <div>
            <input type="number" min="1" max="{{ item.available_qty if item.available_qty > 0 else 1 }}" value="1" id="qty-{{ loop.index }}">
            <button type="button" class="btn small"
                onclick="addItem('{{ item.type|e }}', '{{ item.item_name|e }}', document.getElementById('qty-{{ loop.index }}').value)">
                Add
            </button>
        </div>
    </div>
    {% endfor %}
</div>
{% else %}
<div class="empty-state">No matching components. Try a different search term.</div>
{% endif %}
