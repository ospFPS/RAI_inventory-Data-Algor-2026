{% extends "base.html" %}
{% block title %}Login · RAI Item Allocator{% endblock %}
{% block content %}
<div class="login-shell">
    <div class="login-card">
        <h1>RAI Item Allocator</h1>
        <p class="page-subtitle">Priorities always come first</p>
        <form method="post" action="/login" class="role-choice">
            <button class="btn" type="submit" name="chosen_role" value="student">Continue as Student</button>
            <button class="btn secondary" type="submit" name="chosen_role" value="admin">Continue as Admin</button>
        </form>
    </div>
</div>
{% endblock %}
