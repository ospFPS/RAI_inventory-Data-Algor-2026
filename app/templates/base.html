<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}RAI Item Allocator{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="brand">
                <span class="brand-mark">RAI</span>
                <span class="brand-tagline">Priorities always come first</span>
            </div>
            <nav>
                <a href="/dashboard" class="{{ 'active' if active_nav == 'dashboard' }}">Dashboard</a>
                <a href="/new-request" class="{{ 'active' if active_nav == 'new_request' }}">New Request</a>
                <a href="/inventory" class="{{ 'active' if active_nav == 'inventory' }}">Inventory</a>
                <a href="/pending" class="{{ 'active' if active_nav == 'pending' }}">Pending</a>
                <a href="/borrowed" class="{{ 'active' if active_nav == 'borrowed' }}">Borrowed</a>
                <a href="/returns" class="{{ 'active' if active_nav == 'returns' }}">Returns</a>
                <a href="/damaged" class="{{ 'active' if active_nav == 'damaged' }}">Damaged Items</a>
                <a href="/admin" class="{{ 'active' if active_nav == 'admin' }}">Admin View</a>
            </nav>
            <div class="role-box">
                <div class="role-label">Signed in as</div>
                <div class="role-value">{{ "Admin" if role == "admin" else "Student" }}</div>
                <a href="/login" class="role-switch">Switch role</a>
            </div>
        </aside>
        <main class="content">
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
